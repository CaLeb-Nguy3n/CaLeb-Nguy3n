<svg width="412" height="214" viewBox="0 0 412 214" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgRight" x1="0" y1="0" x2="412" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11161f" />
      <stop offset="100%" stop-color="#141720" />
    </linearGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 30) rotate(130) scale(160 120)">
      <stop offset="0%" stop-color="#f0b36a" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#f0b36a" stop-opacity="0" />
    </radialGradient>
    <clipPath id="clipRight">
      <rect x="0.5" y="0.5" width="411" height="213" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#clipRight)">
    <rect x="0.5" y="0.5" width="411" height="213" rx="16" fill="url(#bgRight)" />
    <rect x="0.5" y="0.5" width="411" height="213" rx="16" fill="url(#glowRight)" />
  </g>
  <rect x="0.5" y="0.5" width="411" height="213" rx="16" stroke="#262e3c" stroke-width="1" />

  <!-- Header -->
  <text x="26" y="34" fill="#f0b36a" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.12em">HOW I ROLL</text>
  <line x1="26" y1="48" x2="386" y2="48" stroke="#212834" stroke-width="1" />

  <!-- Item 01 -->
  <text x="26" y="80" fill="#f0b36a" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="600">01</text>
  <text x="58" y="80" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5">Build whatever genuinely feels fun</text>

  <!-- Item 02 -->
  <text x="26" y="114" fill="#58b8ff" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="600">02</text>
  <text x="58" y="114" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5">Keep things fast, clean &amp; lightweight</text>

  <!-- Item 03 -->
  <text x="26" y="148" fill="#a78bfa" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="600">03</text>
  <text x="58" y="148" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5">Small crews, indie energy, zero ego</text>

  <!-- Item 04 -->
  <text x="26" y="182" fill="#6ee7b7" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="600">04</text>
  <text x="58" y="182" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5">Follow curiosity, skip the noise</text>
</svg>
