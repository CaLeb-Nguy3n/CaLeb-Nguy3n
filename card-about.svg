      <stop offset="50%" stop-color="#30363d" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#f0b36a" stop-opacity="0.38" />
    </linearGradient>
    <clipPath id="clipCard">
      <rect x="0.5" y="0.5" width="839" height="195" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#clipCard)">
