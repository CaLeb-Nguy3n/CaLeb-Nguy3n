  <text x="34" y="130" fill="#9da7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5">projects that look fun, and simply doing what I enjoy on macOS &amp; Linux.</text>

