    <rect x="0.5" y="0.5" width="839" height="195" rx="16" fill="url(#amberGlow)" />
    <rect x="0.5" y="0.5" width="839" height="195" rx="16" fill="url(#blueGlow)" />
  </g>
  <rect x="0.5" y="0.5" width="839" height="195" rx="16" stroke="url(#borderGrad)" stroke-width="1" />

  <!-- Top window accent dots -->
  <circle cx="34" cy="30" r="4" fill="#f0b36a" fill-opacity="0.85" />
  <circle cx="50" cy="30" r="4" fill="#58b8ff" fill-opacity="0.7" />
  <circle cx="66" cy="30" r="4" fill="#8b949e" fill-opacity="0.35" />

