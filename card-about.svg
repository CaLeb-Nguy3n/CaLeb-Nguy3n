<svg width="840" height="196" viewBox="0 0 840 196" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11161f" />
      <stop offset="55%" stop-color="#0f131b" />
      <stop offset="100%" stop-color="#151922" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 28) rotate(135) scale(210 140)">
      <stop offset="0%" stop-color="#f0b36a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f0b36a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 175) rotate(-25) scale(260 130)">
      <stop offset="0%" stop-color="#58b8ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58b8ff" stop-opacity="0" />
