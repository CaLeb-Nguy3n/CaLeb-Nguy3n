  <text x="34" y="76" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.02em">Caleb Nguyen</text>
  <text x="218" y="75" fill="#7d8590" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13">@phuchungn159-cpu</text>

  <!-- Bio lines -->
