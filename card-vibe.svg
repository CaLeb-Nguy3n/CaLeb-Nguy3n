<svg width="412" height="214" viewBox="0 0 412 214" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLeft" x1="0" y1="0" x2="412" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11161f" />
      <stop offset="100%" stop-color="#0e121a" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 30) rotate(130) scale(160 120)">
      <stop offset="0%" stop-color="#58b8ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58b8ff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="clipLeft">
      <rect x="0.5" y="0.5" width="411" height="213" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#clipLeft)">
